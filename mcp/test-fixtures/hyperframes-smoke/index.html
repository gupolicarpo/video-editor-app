<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #stage {
        position: relative;
        width: 320px;
        height: 180px;
        background: transparent;
      }
      #fx {
        position: absolute;
        left: 60px;
        top: 55px;
        padding: 14px 24px;
        border-radius: 12px;
        color: white;
        background: #7657ff;
        font: 700 26px Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="smoke"
      data-start="0"
      data-duration="1"
      data-width="320"
      data-height="180"
      data-no-timeline
    >
      <div id="fx" class="clip" data-start="0" data-duration="1" data-track-index="0">FX</div>
    </div>
    <script>
      addEventListener('hf-seek', (event) => {
        const progress = Math.max(0, Math.min(1, event.detail.time))
        const fx = document.getElementById('fx')
        fx.style.transform = `translateY(${(1 - progress) * 35}px) scale(${0.8 + progress * 0.2})`
        fx.style.opacity = String(progress)
      })
    </script>
  </body>
</html>
